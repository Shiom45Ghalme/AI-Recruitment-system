{% extends "base.html" %}

{% block title %}Candidate Registration{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-lg">
            <div class="card-header bg-primary text-white text-center">
                <h3><i class="fas fa-user-plus"></i> Candidate Registration</h3>
            </div>
            <div class="card-body p-5">
                <form method="POST">
                    <div class="mb-4">
                        <label for="name" class="form-label">Full Name *</label>
                        <input type="text" class="form-control" id="name" name="name" required 
                               placeholder="Enter your full name">
                    </div>
                    
                    <div class="mb-4">
                        <label for="email" class="form-label">Email Address *</label>
                        <input type="email" class="form-control" id="email" name="email" required 
                               placeholder="your.email@example.com">
                    </div>
                    
                    <div class="mb-4">
                        <label for="role" class="form-label">Select Role *</label>
                        <select class="form-select" id="role" name="role" required>
                            <option value="">Choose a role...</option>
                            {% for role_name, criteria in roles.items() %}
                            <option value="{{ role_name }}">{{ role_name.replace('_', ' ').title() }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div id="role-criteria" class="alert alert-info" style="display:none;">
                        <h6>Role Requirements:</h6>
                        <div id="criteria-content"></div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-lg w-100">
                        <i class="fas fa-arrow-right"></i> Continue to Application
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
const roles = {{ roles | tojson | safe }};
document.getElementById('role').addEventListener('change', function() {
    const selectedRole = this.value;
    const criteriaDiv = document.getElementById('role-criteria');
    const criteriaContent = document.getElementById('criteria-content');
    
    if (selectedRole && roles[selectedRole]) {
        criteriaContent.innerHTML = '<pre style="white-space: pre-wrap; font-size: 0.9rem;">' + roles[selectedRole] + '</pre>';
        criteriaDiv.style.display = 'block';
    } else {
        criteriaDiv.style.display = 'none';
    }
});
</script>
{% endblock %}
